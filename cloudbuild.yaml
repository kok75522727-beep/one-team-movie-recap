steps:
  # ၁။ Dockerfile အတိုင်း Container Image တည်ဆောက်ခြင်း
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/github.com/kok75522727-beep/one-team-movie-recap:$COMMIT_SHA', '.']

  # ၂။ တည်ဆောက်ထားသော Image ကို Registry ထဲ သိမ်းဆည်းခြင်း
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/github.com/kok75522727-beep/one-team-movie-recap:$COMMIT_SHA']

  # ၃။ Cloud Run ဆီသို့ Auto Deploy ပြုလုပ်ခြင်း
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'one-team-movie-recap'
      - '--image'
      - 'gcr.io/$PROJECT_ID/github.com/kok75522727-beep/one-team-movie-recap:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'

images:
  - 'gcr.io/$PROJECT_ID/github.com/kok75522727-beep/one-team-movie-recap:$COMMIT_SHA'
